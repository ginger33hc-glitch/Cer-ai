name: Deep Import Isolation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * 6'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-file-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}
      OPENAI_API_KEY: test-key-for-import-only
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
      - name: Install dependencies
        run: pip install --require-hashes -r requirements-dev.txt
      - name: Test every file in an isolated process
        shell: bash
        run: |
          for test_file in tests/test_*.py research/test_*.py; do
            python -m pytest -q "$test_file"
          done
