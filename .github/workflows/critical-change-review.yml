name: Critical Change Review

on:
  pull_request:
    branches: [main]
    paths:
      - canonical_engine.py
      - clinical_core/**
      - iol_module/**
      - assessment_workflow.py
      - case_archive.py
      - archive_privacy.py
      - .github/workflows/**
      - railway.toml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  critical-regression:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
      OPENAI_API_KEY: test-key-for-import-only
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install --require-hashes -r requirements-dev.txt
      - name: Canonical and archive regression gates
        run: |
          python -m pytest -q \
            tests/test_canonical_runtime_service.py \
            tests/test_canonical_workflow_cutover.py \
            tests/test_canonical_workflow_cutover_contract.py \
            tests/test_case_archive.py \
            tests/test_archive_privacy.py \
            tests/test_iol_module.py
