name: Mobile validation bundles
on:
  pull_request:
    paths:
      - 'mobile/**'
      - 'extensions/escrs-assistant/adapter.js'
      - '.github/workflows/mobile-validation.yml'
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'extensions/escrs-assistant/adapter.js'
      - '.github/workflows/mobile-validation.yml'
permissions:
  contents: read
jobs:
  mobile-bundles:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npx expo install --check
      - run: npx expo export --platform all
        env:
          CI: '1'
