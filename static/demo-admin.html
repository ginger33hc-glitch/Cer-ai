<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CER-AI Demo Membership Requests</title>
  <meta name="robots" content="noindex,nofollow">
  <style>
    :root{--navy:#173b57;--blue:#1f5e8c;--ink:#17212b;--muted:#66717d;--line:#d9e0e6;--bg:#f4f6f8;--green:#176b3a;--amber:#9a5a00;--red:#a31212}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,sans-serif}.top{background:#05090d;color:#fff;padding:13px 20px}.top-inner{max-width:1050px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:14px}.top a{color:#fff;background:#173b57;border:1px solid #56728a;border-radius:6px;padding:7px 10px;text-decoration:none;font-size:12px}main{max-width:1050px;margin:22px auto;padding:0 14px 40px}h1{color:var(--navy);font-size:26px;margin:0 0 7px}.lead{color:var(--muted);margin:0 0 18px}.tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}.tabs button{width:auto;margin:0}.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;margin:13px 0;box-shadow:0 2px 8px rgba(0,0,0,.04)}.head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.head h2{font-size:18px;color:var(--navy);margin:0}.badge{font-size:11px;font-weight:800;padding:5px 8px;border-radius:999px;background:#edf3f7;color:var(--blue)}.meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px 20px;color:var(--muted);font-size:13px;margin:13px 0}.meta strong{color:var(--ink)}.approval{display:grid;grid-template-columns:1fr 1fr auto auto;gap:9px;align-items:end;border-top:1px solid var(--line);padding-top:13px}.field label{display:block;font-size:12px;font-weight:700;color:var(--navy);margin-bottom:5px}.field input{width:100%;padding:10px;border:1px solid #b9c5ce;border-radius:7px;font-size:16px}button{padding:11px 13px;border:0;border-radius:7px;background:var(--navy);color:#fff;font-weight:800;cursor:pointer}button.reject{background:#fff;color:var(--red);border:1px solid var(--red)}button:disabled{opacity:.6}.status{min-height:22px;font-size:13px;color:var(--muted);margin:10px 0}.error{color:var(--red);font-weight:700}.approved{color:var(--green)}.rejected{color:var(--red)}.empty{text-align:center;color:var(--muted);padding:28px}.security{font-size:11px;color:var(--muted);margin-top:8px}@media(max-width:760px){.approval{grid-template-columns:1fr}.meta{grid-template-columns:1fr}.head{flex-direction:column}}
  </style>
</head>
<body>
<header class="top"><div class="top-inner"><strong>CER-AI · Demo membership requests</strong><a href="/archive-ui">Case Archive</a></div></header>
<main>
  <h1>Demo membership requests</h1>
  <p class="lead">Review a doctor’s request, define the personal username and password, and activate a 10-patient demo account.</p>
  <div id="phoneSetup" class="card" hidden></div>
  <div class="tabs"><button type="button" data-filter="PENDING">Pending</button><button type="button" data-filter="ALL">All requests</button></div>
  <div id="status" class="status" aria-live="polite">Loading requests…</div>
  <div id="requests"></div>
</main>
<script src="/static/i18n.js?v=26"></script>
<script>
(() => {
  const list=document.getElementById("requests"),status=document.getElementById("status");let records=[],filter="PENDING";
  const tr=value=>window.CERAI_I18N?window.CERAI_I18N.translate(value):value;
  const esc=value=>String(value??"").replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[ch]));
  const api=async(url,options={})=>{const response=await fetch(url,{credentials:"same-origin",cache:"no-store",...options});if(response.status===401){window.location.replace("/auth/login-page?next=/demo-admin");throw new Error("CER-AI sign-in required.");}const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.detail||"Request failed.");return data;};
  const setup=document.getElementById("phoneSetup");
  api("/demo-access/admin/notification-setup").then(data=>{if(data.provider!=="NTFY"||!data.subscription_url)return;setup.hidden=false;setup.innerHTML=`<strong>${esc(tr("Phone alerts for demo requests"))}</strong><p>${esc(tr("Install the ntfy Android app, then open the private subscription link on your phone. Keep the topic private; notifications contain no applicant details."))}</p><a href="${esc(data.subscription_url)}">${esc(tr("Subscribe to owner alerts"))}</a>`;}).catch(()=>{});
  const render=()=>{const shown=records.filter(item=>filter==="ALL"||item.status===filter);if(!shown.length){list.innerHTML=`<div class="card empty">${esc(tr(filter==="PENDING"?"No pending demo requests.":"No demo requests."))}</div>`;return;}list.innerHTML=shown.map(item=>{
    const final=item.status!=="PENDING"?`<div class="${item.status==="APPROVED"?"approved":"rejected"}"><strong>${esc(item.status)}</strong>${item.username?` · ${esc(item.username)} · ${esc(item.credits_used??0)}/${esc(item.quota_limit??10)} ${esc(tr("patient credits used"))}`:""}</div>`:"";
    const controls=item.status==="PENDING"?`<div class="approval"><div class="field"><label>${esc(tr("Username"))}</label><input data-username maxlength="64" autocomplete="off"></div><div class="field"><label>${esc(tr("New password — minimum 12 characters"))}</label><input data-password type="password" minlength="12" autocomplete="new-password"></div><button type="button" data-approve>${esc(tr("Approve and activate 10 credits"))}</button><button class="reject" type="button" data-reject>${esc(tr("Reject"))}</button></div><div class="security">${esc(tr("The password is hashed before storage and will not be displayed again. Give the credentials to the doctor through a separate secure channel."))}</div>`:final;
    const retry=item.notification_status!=="SENT"?`<button type="button" data-retry>${esc(tr("Retry owner notification"))}</button>`:"";
    return `<article class="card" data-id="${esc(item.request_id)}"><div class="head"><h2>${esc(item.doctor_name)}</h2><span class="badge">${esc(item.status)}</span></div><div class="meta"><div><strong>${esc(tr("Institution"))}:</strong> ${esc(item.institution)}</div><div><strong>${esc(tr("Professional email"))}:</strong> ${esc(item.email)}</div><div><strong>${esc(tr("Phone / WhatsApp"))}:</strong> ${esc(item.phone||"—")}</div><div><strong>${esc(tr("Country"))}:</strong> ${esc(item.country||"—")}</div><div><strong>${esc(tr("Specialty"))}:</strong> ${esc(item.specialty||"—")}</div><div><strong>${esc(tr("Requested"))}:</strong> ${esc(item.created_at_utc||"")}</div><div><strong>${esc(tr("Owner notification"))}:</strong> ${esc(item.notification_status||"NOT_ATTEMPTED")} (${esc(item.notification_provider||"—")})${item.notification_error_code?` · ${esc(item.notification_error_code)}`:""}</div></div>${retry} ${controls}</article>`;
  }).join("");};
  const load=async()=>{status.className="status";status.textContent=tr("Loading requests…");try{records=(await api("/demo-access/admin/requests")).requests||[];render();status.textContent=`${records.filter(item=>item.status==="PENDING").length} ${tr("pending request(s)")}`;}catch(error){status.className="status error";status.textContent=error.message;}};
  list.addEventListener("click",async event=>{const card=event.target.closest("[data-id]");if(!card)return;const requestId=card.dataset.id;if(event.target.closest("[data-retry]")){event.target.disabled=true;try{const result=await api(`/demo-access/admin/requests/${requestId}/retry-notification`,{method:"POST"});await load();status.textContent=result.notification_status==="SENT"?tr("Notification provider accepted the alert. Phone delivery remains unverified."):`${tr("Owner notification failed")}: ${result.notification_error_code||"UNKNOWN"}`;}catch(error){status.className="status error";status.textContent=error.message;}finally{event.target.disabled=false;}return;}if(event.target.closest("[data-approve]")){const username=card.querySelector("[data-username]").value,password=card.querySelector("[data-password]").value;if(!username||password.length<12){status.className="status error";status.textContent=tr("Enter a username and a password of at least 12 characters.");return;}event.target.disabled=true;try{await api(`/demo-access/admin/requests/${requestId}/approve`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username,password})});status.className="status approved";status.textContent=tr("Demo account approved and activated with 10 patient credits.");await load();}catch(error){status.className="status error";status.textContent=error.message;}finally{event.target.disabled=false;}}else if(event.target.closest("[data-reject]")){if(!window.confirm(tr("Reject this demo request?")))return;try{await api(`/demo-access/admin/requests/${requestId}/reject`,{method:"POST"});await load();}catch(error){status.className="status error";status.textContent=error.message;}}});
  document.querySelectorAll("[data-filter]").forEach(button=>button.addEventListener("click",()=>{filter=button.dataset.filter;render();}));load();
})();
</script>
</body>
</html>
